<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProfRev video</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style></head><body>
<script>
var q=new URLSearchParams(location.search),v=(q.get("v")||"").replace(/[^\w-]/g,"").slice(0,11),t=parseInt(q.get("t")||"0",10)||0;
var f=document.createElement("iframe");
f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write";f.allowFullscreen=true;f.referrerPolicy="strict-origin-when-cross-origin";
f.src="https://www.youtube.com/embed/"+v+"?autoplay=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin="+encodeURIComponent(location.origin)+(t?"&start="+t:"");
document.body.appendChild(f);
/* relay player events up to ProfRev and commands down to YouTube, so Rev still knows the current timestamp */
window.addEventListener("message",function(e){
  if(e.source===f.contentWindow){ try{ parent.postMessage(e.data,"*"); }catch(x){} }
  else if(e.source===parent){ try{ f.contentWindow.postMessage(e.data,"*"); }catch(x){} }
});
</script></body></html>
